services:
  # The API's database (RFC-0008, ADR-0025). Same image and tag as CI. No published port:
  # several compose projects (worktrees) run side by side, and a fixed host port would
  # collide. Reach it with `docker compose exec postgres psql -U postgres -h localhost`.
  postgres:
    image: supabase/postgres:17.11.0.003
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Applies the migrations once, then exits; the API starts only after it succeeded.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      # env.ts requires it; migrating verifies no token.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-wally-local}
    command: ['pnpm', '--filter', '@wally/api', 'db:migrate']
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/config/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      # ID tokens are verified against the real Firebase project, which is why
      # FIREBASE_PROJECT_ID in .env still matters (there is no service-account key).
      PORT: 4000
      CORS_ORIGIN: http://localhost:5174
      AUTH0_ENABLED: ${AUTH0_ENABLED:-false}
      AUTH0_SIGNUP_ENABLED: ${AUTH0_SIGNUP_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_WRITES_ENABLED: ${MCP_WRITES_ENABLED:-false}
      # Optional MCP_CLIENT_ID is inherited from .env; do not inject an empty string.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/config/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-firebase}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
    ports:
      # Host 5173 is already taken by another project on this machine — publish on 5174
      # instead. The container's own Vite server still listens on 5173 internally.
      - '5174:5173'
    depends_on:
      - api
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/config/node_modules

volumes:
  postgres-data:
