services:
  firestore:
    build:
      context: .
      dockerfile: infra/firebase-emulator.Dockerfile
    # Run under the same project id the API writes with, so the Emulator UI opens on the
    # data this app actually stores. (The emulator still serves any project id — that's
    # what lets each test file use its own.)
    command:
      - firebase
      - emulators:start
      - --only
      - firestore
      - --project
      - ${FIREBASE_PROJECT_ID:-wally-local}
    # The emulator reads firebase.json for its port/host config and picks up the rules and
    # index definitions next to it. Read-only: nothing in the container should edit them.
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
    ports:
      # All three are for the Emulator UI, which runs in YOUR browser and therefore reaches
      # the emulator over the host, not the compose network: 4001 serves the UI itself,
      # 8080 is the Firestore data API it reads, and 9150 the websocket behind its request
      # monitor. Publishing only 4001 gets you a blank page and a "Failed to fetch".
      # The API container still reaches the data port as `firestore:8080`.
      - '4001:4001'
      - '8080:8080'
      - '9150:9150'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      # The Admin SDK reads this itself and routes all Firestore traffic to the emulator.
      # Firebase Auth is NOT redirected — ID tokens are still verified against the real
      # project, which is why FIREBASE_PROJECT_ID in .env still matters (it is the only
      # Firebase value the API needs; there is no service-account key).
      FIRESTORE_EMULATOR_HOST: firestore:8080
      PORT: 4000
      CORS_ORIGIN: http://localhost:5174
      AUTH0_ENABLED: ${AUTH0_ENABLED:-false}
      AUTH0_SIGNUP_ENABLED: ${AUTH0_SIGNUP_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_WRITES_ENABLED: ${MCP_WRITES_ENABLED:-false}
      # Optional MCP_CLIENT_ID is inherited from .env; do not inject an empty string.
    ports:
      - '4000:4000'
    depends_on:
      firestore:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/config/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-firebase}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
    ports:
      # Host 5173 is already taken by another project on this machine — publish on 5174
      # instead. The container's own Vite server still listens on 5173 internally.
      - '5174:5173'
    depends_on:
      - api
    volumes:
      - .:/repo
      - /repo/node_modules
      - /repo/apps/api/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
      - /repo/packages/config/node_modules
