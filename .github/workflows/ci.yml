name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Read-only by default. No job here needs more; the release workflow elevates on its own.
permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR, but group pushes to main by SHA so they never cancel
  # each other (a cancelled run on main leaves a misleading red check on a merged commit).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Decides whether a pull request can affect the app at all. Documentation, Terraform, the
  # Auth0 Action, and a few files no CI job reads (the Infrastructure and Keepalive workflows,
  # the web Worker's wrangler.jsonc, .gitignore) change nothing that typecheck, the unit
  # suites or E2E test, so those three jobs read this and skip. Lint & format always runs: it
  # keeps Markdown prettier-checked and runs scripts/auth0-post-login.test.mjs, the Action's
  # own test. See ADR-0029.
  changes:
    name: Detect changes without app impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      # A pull_request run checks out the merge commit refs/pull/N/merge. Its first parent is
      # the base branch tip, so depth 2 is all the diff below needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - name: Classify the changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Pushes to main always count as app changes: release.yml requires main's full CI
          # run, E2E included, before it deploys a tag.
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            # In a case pattern `*` also matches `/`, so `*.md` covers Markdown at any depth
            # and `infra/terraform/*` everything below it. Anything else counts as an app
            # change: ci.yml, release.yml and .github/actions/ among it, and
            # apps/api-proxy/wrangler.jsonc, which the proxy's build (`wrangler deploy
            # --dry-run`) reads in Typecheck & build.
            case "$file" in
              docs/* | *.md | infra/terraform/* | infra/auth0-post-login.cjs | \
                .github/workflows/infrastructure.yml | .github/workflows/keepalive.yml | \
                apps/web/wrangler.jsonc | .gitignore)
                echo "no app impact: $file" ;;
              *)
                echo "app impact:    $file"
                app=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  static:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: node --test scripts/*.test.mjs
      - run: pnpm run format:check
      - run: pnpm turbo run lint

  typecheck-build:
    name: Typecheck & build
    # Skipped when a pull request has no app impact (the `changes` job, ADR-0029).
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      # One invocation, not two jobs: typecheck's `dependsOn: ["^build"]` and build's own
      # graph share @wally/shared#build, so turbo executes it exactly once.
      #
      # Both are needed. `typecheck` and `build` use DIFFERENT tsconfigs — build runs
      # `tsc -p tsconfig.build.json`, which adds rootDir and excludes tests. docs/DEPLOY.md
      # records a real incident where typecheck was clean and the production build failed.
      - run: pnpm turbo run typecheck build --cache-dir=.turbo/cache

  # The API's suites need PostgreSQL and run on their own runner; the others (web and
  # api-proxy) run on another, without the database. `Unit & integration tests`
  # below is the required check and passes only when both passed.
  unit-api:
    name: Unit & integration tests (API)
    # Skipped when a pull request has no app impact (the `changes` job, ADR-0029).
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Each API test file clones its own database from a template migrated once per run
      # (apps/api/test/postgres.ts). 127.0.0.1 rather than localhost: Node 22 resolves
      # localhost to ::1 first, and the service publishes on IPv4.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      # Same image and tag as docker-compose.yml, so CI runs the engine Supabase runs.
      postgres:
        image: supabase/postgres:17.11.0.003
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm turbo run test --filter=@wally/api

  unit-rest:
    name: Unit tests (web and API proxy)
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm turbo run test --filter='!@wally/api'

  # The required check keeps its name (the ruleset on main requires it) and gathers the two.
  # It passes when both passed, or when both were skipped because the `changes` job found no
  # app impact; any other result, a failed `changes` job included, fails it.
  unit-tests:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, unit-api, unit-rest]
    if: always()
    steps:
      - name: Require both unit jobs to have passed
        env:
          API: ${{ needs.unit-api.result }}
          REST: ${{ needs.unit-rest.result }}
          NO_APP_IMPACT: ${{ needs.changes.result == 'success' && needs.changes.outputs.app == 'false' }}
        run: |
          set -euo pipefail
          echo "API: $API, web and API proxy: $REST"
          if [ "$API" = "success" ] && [ "$REST" = "success" ]; then exit 0; fi
          if [ "$NO_APP_IMPACT" = "true" ] && [ "$API" = "skipped" ] && [ "$REST" = "skipped" ]; then
            echo "Skipped: this pull request has no app impact (ADR-0029)."; exit 0
          fi
          echo "::error title=Unit tests failed::API=$API, web and API proxy=$REST"
          exit 1

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CI signs in with Auth0, as production does, through the hosted login page. The app and
      # API are served over HTTPS under their production names, mapped to loopback inside this
      # runner only (docker-compose.auth0-ci.yml and the preparation step below).
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml:docker-compose.auth0-ci.yml
      PLAYWRIGHT_BASE_URL: https://wally.luminull.com
    # Only run where the secrets actually exist. `github.event.pull_request` is null for
    # push, so the event check short-circuits and the job runs on main, whose result
    # release.yml requires before deploying. Comparing full_name (rather than `.fork`) also
    # covers a PR opened from a fork of a fork.
    #
    # It is also skipped when a pull request has no app impact (the `changes` job, ADR-0029);
    # the gate below accepts exactly that skip.
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup

      - name: Resolve the Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # Exact match only — a partial hit restores the wrong browser build.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The Azure mirror stalled package downloads twice before any browser test ran.
      # Use Ubuntu's standard archive; distribution, packages and signature checks stay intact.
      - name: Use the standard Ubuntu archive for browser dependencies
        run: |
          # Hosted images can select mirrors indirectly through mirror+file URIs.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/*mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' "$source"
            fi
          done

      # The browsers' system libraries (apt, about 45 s) install in the background while the
      # stack's images build, then the job waits for them. chromium AND webkit: the
      # mobile-list-only project uses devices['iPhone 13'], whose defaultBrowserType is
      # 'webkit'. Installing only chromium silently breaks it. The cache holds browser
      # binaries, not the apt libraries they link against. libnss3-tools provides certutil,
      # which trusts the test CA once the install is done.
      - name: Start installing the browsers' dependencies
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/browser-deps.log"
          (
            status=0
            {
              if [ "$CACHE_HIT" = "true" ]; then
                pnpm --filter @wally/web exec playwright install-deps chromium webkit
              else
                pnpm --filter @wally/web exec playwright install --with-deps chromium webkit
              fi
              sudo apt-get install -y libnss3-tools
            } > "$log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/browser-deps.status"
          ) < /dev/null > /dev/null 2>&1 &
          # Detached from this step's output, so the step ends now and the install carries on.
          disown
          echo "started; log at $log"

      # docker-compose.yml declares `env_file: .env` non-optionally, so compose aborts if
      # the file is missing. Optional variables are left out rather than blanked: env_file
      # turns `KEY=` into an empty string, which env.ts rejects at boot.
      #
      # No credential is needed: the database is the stack's own PostgreSQL, and verifying an
      # Auth0 access token needs only Auth0's public keys.
      - name: Generate .env for the compose stack
        env:
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
        run: |
          set -euo pipefail
          [ -n "$VITE_AUTH0_CLIENT_ID" ] || { echo "::error::VITE_AUTH0_CLIENT_ID is required"; exit 1; }
          cat > .env <<EOF
          PORT=4000
          CORS_ORIGIN=http://localhost:5174
          VITE_API_BASE_URL=http://localhost:4000
          AUTH0_SIGNUP_ENABLED=false
          VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
          MCP_ENABLED=false
          ASSISTANT_ENABLED=false
          EOF

      # Same-site HTTPS is necessary for memory-only Auth0 session restoration.
      # Trust an ephemeral CA only inside this disposable runner; never ignore TLS errors.
      - name: Prepare isolated Auth0 HTTPS origins
        run: |
          set -euo pipefail
          [ "$GITHUB_ACTIONS" = "true" ] && [ "$CI" = "true" ]
          tls_dir="$RUNNER_TEMP/wally-auth0-tls"
          mkdir -m 700 "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Wally ephemeral CI CA' \
            -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=wally.luminull.com' \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" 2>/dev/null
          printf '%s\n' 'subjectAltName=DNS:wally.luminull.com,DNS:api.wally.luminull.com' \
            'extendedKeyUsage=serverAuth' > "$tls_dir/server.ext"
          openssl x509 -req -in "$tls_dir/server.csr" -CA "$tls_dir/ca.crt" \
            -CAkey "$tls_dir/ca.key" -CAcreateserial -days 1 \
            -extfile "$tls_dir/server.ext" -out "$tls_dir/server.crt" 2>/dev/null
          chmod 600 "$tls_dir/ca.key" "$tls_dir/server.key"
          sudo cp "$tls_dir/ca.crt" /usr/local/share/ca-certificates/wally-ci.crt
          sudo update-ca-certificates
          printf '%s\n' '127.0.0.1 wally.luminull.com api.wally.luminull.com' | sudo tee -a /etc/hosts
          # Fail closed before any browser can send API requests to a public Wally service.
          for host in wally.luminull.com api.wally.luminull.com; do
            [ "$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)" = '127.0.0.1' ]
          done
          echo "AUTH0_CI_TLS_DIR=$tls_dir" >> "$GITHUB_ENV"
          # Playwright route.fetch runs in Node, which has a separate CA store.
          echo "NODE_EXTRA_CA_CERTS=$tls_dir/ca.crt" >> "$GITHUB_ENV"

      # NOT `make up`: that is `docker compose up -d` with no wait, so a container that dies
      # at boot surfaces as an opaque Playwright timeout instead of a readable error. The image
      # build here (about a minute) is what the browsers' dependencies install alongside.
      - name: Start the stack
        run: |
          docker compose \
            up -d --build --wait --wait-timeout 300

      - name: Wait for the browsers' dependencies
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/browser-deps.status"
          for _ in $(seq 1 300); do
            [ -f "$status_file" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/browser-deps.log"
          [ -f "$status_file" ] || { echo "::error::browser dependencies still installing after 5 minutes"; exit 1; }
          [ "$(cat "$status_file")" = "0" ] || { echo "::error::installing the browser dependencies failed"; exit 1; }

      # Chromium reads its own certificate store (NSS), not the system one. certutil comes
      # from libnss3-tools, installed with the browsers' dependencies above.
      - name: Trust the test CA in the browsers' certificate store
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n wally-ci -t 'C,,' -i "$AUTH0_CI_TLS_DIR/ca.crt"

      # --wait honours the compose healthchecks, but those run INSIDE the containers and say
      # nothing about the published ports; `web` has no healthcheck at all. Assert from the
      # host before handing over to Playwright.
      - name: Wait for the published ports
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            api=$(curl -fsS http://localhost:4000/health 2>/dev/null || true)
            web=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:5174/ 2>/dev/null || true)
            # Match the status field, not the whole body: /health also reports the assistant.
            if jq -e '.status == "ok"' <<<"$api" >/dev/null 2>&1 && [ "$web" = "200" ]; then
              echo "stack ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::stack did not become ready"
          docker compose logs --no-color --tail=200
          exit 1

      - name: Verify isolated HTTPS routing
        run: |
          set -euo pipefail
          # Normal certificate validation, no --insecure. Assert the socket's peer as well.
          for host in wally.luminull.com api.wally.luminull.com; do
            path=/
            [ "$host" != 'api.wally.luminull.com' ] || path=/health
            peer=$(curl --fail --silent --show-error --output /dev/null --write-out '%{remote_ip}' "https://$host$path")
            [ "$peer" = '127.0.0.1' ]
          done

      - name: Verify Node trusts the test certificate
        run: node -e "fetch('https://api.wally.luminull.com/health').then(r => { if (!r.ok) process.exit(1); }).catch(e => { console.error(e.message); process.exit(1); })"

      - name: Seed
        run: |
          docker compose \
            run --rm api pnpm --filter @wally/api seed

      - name: Bind Auth0 CI identity in the stack's database
        env:
          E2E_AUTH0_SUBJECT: ${{ vars[github.actor == 'dependabot[bot]' && 'E2E_AUTH0_DEPENDABOT_SUBJECT' || 'E2E_AUTH0_SUBJECT'] }}
          E2E_AUTH0_EMAIL: ${{ vars[github.actor == 'dependabot[bot]' && 'E2E_AUTH0_DEPENDABOT_EMAIL' || 'E2E_AUTH0_EMAIL'] }}
        run: |
          docker compose \
            exec -T -e E2E_AUTH0_SUBJECT -e E2E_AUTH0_EMAIL api \
            pnpm --filter @wally/api exec tsx src/seed-auth0-e2e.ts

      - name: Run Playwright
        env:
          E2E_USER_EMAIL: ${{ vars[github.actor == 'dependabot[bot]' && 'E2E_AUTH0_DEPENDABOT_EMAIL' || 'E2E_AUTH0_EMAIL'] }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_AUTH0_USER_PASSWORD }}
        run: |
          [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ] || {
            echo "::error::The Auth0 E2E credentials are missing"; exit 1;
          }
          pnpm --filter @wally/web exec playwright test --max-failures=3

      # Every spec opens with test.skip(!hasE2eCredentials, ...), so a missing secret
      # produces a PASSING run that tested nothing. test.skip() inside a test body still
      # emits a result object, so counting tests is not enough — count by OUTCOME.
      - name: Fail if the suite was vacuously green
        if: always()
        env:
          MIN_EXECUTED: '27' # 1 under setup + 24 under chromium-desktop + 1 under mobile-list-only + 1 under account-deletion
        run: |
          set -euo pipefail
          REPORT=apps/web/playwright-results.json
          [ -f "$REPORT" ] || { echo "::error::no JSON report at $REPORT — Playwright never ran"; exit 1; }

          Q='[.. | objects | select(has("projectName") and has("results"))]'
          jq -r "$Q | group_by(.projectName)
            | map({p:.[0].projectName, total:length,
                   executed:(map(select(.status!=\"skipped\"))|length),
                   passed:(map(select(.status==\"expected\"))|length),
                   flaky:(map(select(.status==\"flaky\"))|length)})
            | .[] | \"\(.p): total=\(.total) executed=\(.executed) passed=\(.passed) flaky=\(.flaky)\"" \
            "$REPORT" | tee -a "$GITHUB_STEP_SUMMARY"

          EXECUTED=$(jq "$Q | map(select(.status!=\"skipped\")) | length" "$REPORT")
          SKIPPED=$(jq  "$Q | map(select(.status==\"skipped\"))  | length" "$REPORT")
          PROJECTS=$(jq "$Q | map(.projectName) | unique | length" "$REPORT")

          if [ "$SKIPPED" -ne 0 ]; then
            echo "::error title=Vacuous E2E run::$SKIPPED test(s) reported 'skipped'. Every spec starts with test.skip(!hasE2eCredentials, ...), so E2E_USER_EMAIL / E2E_USER_PASSWORD almost certainly did not reach the runner."
            exit 1
          fi
          if [ "$EXECUTED" -lt "$MIN_EXECUTED" ]; then
            echo "::error title=Vacuous E2E run::only $EXECUTED test(s) executed, expected at least $MIN_EXECUTED"
            exit 1
          fi
          if [ "$PROJECTS" -lt 4 ]; then
            echo "::error title=Vacuous E2E run::only $PROJECTS Playwright project(s) produced results; expected setup, chromium-desktop, mobile-list-only and account-deletion"
            exit 1
          fi
          echo "E2E: $EXECUTED executed, 0 skipped, across $PROJECTS projects."

      # playwright-report/ ONLY. test-results/ holds raw attachments; traces and video are
      # disabled in CI (see playwright.config.ts) because this repository is public and a
      # trace records the E2E account's password verbatim. Keeping test-results/ out means a
      # future `trace: 'on'` cannot silently publish credentials.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      # Compose needs AUTH0_CI_TLS_DIR (docker-compose.auth0-ci.yml); before the HTTPS
      # preparation step sets it, no container exists to log or tear down.
      - name: Container logs on failure
        if: failure() && env.AUTH0_CI_TLS_DIR != ''
        run: |
          docker compose ps
          docker compose logs --no-color --tail=400

      - name: Tear down
        if: always() && env.AUTH0_CI_TLS_DIR != ''
        run: docker compose down -v

  # THIS is the required status check, not `e2e`. A fork PR cannot reach the secrets, so
  # `e2e` is skipped there — and a skipped required check counts as passing, which would let
  # exactly the least-trusted PRs merge with no E2E at all.
  #
  # It also stands guard for `Typecheck & build`: it skips when the `changes` job fails, and
  # that skip passes as a required check too. If that job failed, NO_APP_IMPACT below is
  # false, so the gate fails. (`Unit & integration tests` checks the same itself.)
  e2e-gate:
    name: E2E gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, e2e]
    if: always()
    steps:
      - name: Require E2E to have actually passed
        env:
          RESULT: ${{ needs.e2e.result }}
          # Exactly 'true' only when the changes job succeeded and found no app impact.
          NO_APP_IMPACT: ${{ needs.changes.result == 'success' && needs.changes.outputs.app == 'false' }}
          IS_FORK: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then echo "E2E passed."; exit 0; fi
          if [ "$NO_APP_IMPACT" = "true" ] && [ "$RESULT" = "skipped" ]; then
            echo "E2E skipped: this pull request changes only files without app impact (ADR-0029)."; exit 0
          fi
          if [ "$IS_FORK" = "true" ] && [ "$RESULT" = "skipped" ]; then
            echo "::error title=E2E not run::This PR is from a fork, so it cannot access the E2E credentials. A maintainer must push the branch to this repository (gh pr checkout N && git push origin HEAD:pr-N) and merge from there."
            exit 1
          fi
          echo "::error title=E2E failed::needs.e2e.result=$RESULT"
          exit 1
