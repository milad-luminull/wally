name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # NEVER cancel a release in progress: a half-cancelled run can leave the API deployed and
  # the Workers stale. Releases queue instead.
  group: release-production
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ASSISTANT_ENABLED: ${{ vars.ASSISTANT_ENABLED || 'false' }}
  ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL || 'vertex:gemini-3.8-flash' }}
  ASSISTANT_VERTEX_LOCATION: ${{ vars.ASSISTANT_VERTEX_LOCATION || 'eu' }}
  AUTH0_SIGNUP_ENABLED: ${{ vars.AUTH0_SIGNUP_ENABLED || 'false' }}
  MCP_ENABLED: ${{ vars.MCP_ENABLED || 'false' }}
  MCP_WRITES_ENABLED: ${{ vars.MCP_WRITES_ENABLED || 'false' }}
  MCP_CLIENT_ID: ${{ vars.MCP_CLIENT_ID }}
  AUTH0_MANAGEMENT_CLIENT_ID: ${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}
  VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}

jobs:
  # A v* tag can be pushed onto any commit, including one that never saw a pull request.
  # Require the CI run that `push: main` already started for EXACTLY this SHA to have passed,
  # rather than re-running the same suite a second time. The deploy job separately refuses
  # a tag that is not on main. A commit main never pointed at (the middle of a multi-commit
  # push) has no such run and is refused: only tested commits ship.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The push run can still be starting or in progress when the tag lands; wait for it.
          deadline=$((SECONDS + 25 * 60))
          grace=$((SECONDS + 2 * 60))
          while :; do
            run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&per_page=1" \
                    --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              if [ "$SECONDS" -ge "$grace" ]; then
                echo "::error title=Untested commit::no CI run on main for ${SHA}. Tag a commit that main pointed at after a push, or re-run CI on it."
                exit 1
              fi
              echo "no CI run for ${SHA} yet; waiting"
            else
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for ${SHA}: ${url}"
                  exit 0
                fi
                echo "::error title=CI did not pass::CI concluded '${conclusion}' for ${SHA}: ${url}"
                exit 1
              fi
              echo "CI for ${SHA} is ${status}: ${url}"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on ${SHA}"
              exit 1
            fi
            sleep 20
          done

  deploy:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      # Required reviewers and a deployment tag policy of `v*` are configured on this
      # environment in repository settings. It is also the second half of the Workload
      # Identity Federation guard: the provider's attribute condition requires the
      # `environment` claim, which GitHub only mints for a job that declares one.
      name: production
      url: https://wally.luminull.com
    permissions:
      contents: read
      id-token: write # required for the OIDC token; granted on this job only
    env:
      # A variable on the production environment, so it is read here, in the job that
      # declares the environment. Not a secret. Wrangler reads it, and CLOUDFLARE_API_TOKEN,
      # from the environment; the token is passed only to the steps that call Cloudflare.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not an ancestor of main"; exit 1; }
          echo "${GITHUB_REF_NAME} is on main."

      - uses: ./.github/actions/setup

      - name: Derive version strings
        id: ver
        run: |
          set -euo pipefail
          SEMVER="${GITHUB_REF_NAME#v}"
          echo "semver=${SEMVER}"          >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}"    >> "$GITHUB_OUTPUT"

      # Keyless. The organization enforces iam.disableServiceAccountKeyCreation, so there is
      # no service-account JSON to store even if we wanted one.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Validate the canonical public endpoint before making any changes. The check is by
      # behaviour, so it passes whichever edge serves the hostname.
      - name: Verify the canonical API domain and CORS
        run: node scripts/check-api-domain.mjs

      - name: Validate authentication and MCP rollout switches
        run: |
          set -euo pipefail
          for flag in AUTH0_SIGNUP_ENABLED MCP_ENABLED MCP_WRITES_ENABLED ASSISTANT_ENABLED; do
            case "${!flag}" in
              true|false) ;;
              *) echo "::error::$flag must be true or false"; exit 1 ;;
            esac
          done
          # Auth0 is the only sign-in, so the web bundle always needs its public SPA client.
          [ -n "$VITE_AUTH0_CLIENT_ID" ] \
            || { echo "::error::VITE_AUTH0_CLIENT_ID is required"; exit 1; }
          if [ "$MCP_ENABLED" = true ] && [ -z "$MCP_CLIENT_ID" ]; then
            echo "::error::MCP requires MCP_CLIENT_ID"; exit 1
          fi
          if [ "$MCP_WRITES_ENABLED" = true ] && [ "$MCP_ENABLED" != true ]; then
            echo "::error::MCP_WRITES_ENABLED requires MCP_ENABLED=true"; exit 1
          fi
          # IDs are public identifiers. Restrict their alphabet before adding them to
          # gcloud's @-delimited environment argument or a browser bundle.
          for client in MCP_CLIENT_ID VITE_AUTH0_CLIENT_ID; do
            case "${!client}" in
              *[!a-zA-Z0-9_-]*) echo "::error::$client contains invalid characters"; exit 1 ;;
            esac
          done

      - name: Validate the Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] \
            || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] \
            || { echo "::error::the CLOUDFLARE_API_TOKEN secret is not set on the production environment"; exit 1; }

      # Also emits the API runtime configuration (run_env, service_account) that the deploy
      # uses and the post-deploy check asserts, so it is defined once.
      - name: Resolve the candidate configuration and any image to reuse
        id: existing
        run: node scripts/resolve-release-image.mjs

      # Record what to go back to: the serving Cloud Run revision and each Worker's active
      # version. Captured BEFORE anything changes. Refuses when production already serves this
      # release's candidate (a rerun after failed recovery), and when a Worker does not exist
      # yet (docs/DEPLOY.md, Cloudflare setup).
      - name: Capture the current production state
        id: prev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-state.mjs snapshot release-state.json

      - name: Preserve recovery state before mutations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-state.json
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------------------
      # 1. API image. Built on the runner: GitHub runners are amd64, so the Apple-Silicon
      #    reason for Cloud Build (docs/DEPLOY.md section 8) does not apply in CI, and this
      #    avoids uploading the whole repo to a GCS staging bucket on every release.
      # ---------------------------------------------------------------------------------
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `gcloud auth configure-docker` installs a credential helper backed by the ADC that
      # the auth step wrote, which buildx then uses. Deliberately not docker/login-action
      # with steps.auth.outputs.auth_token: that output is the INTERMEDIATE federated STS
      # token from before service-account impersonation, not a registry credential.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the API image
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ steps.ver.outputs.semver }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:latest
          # image-manifest + oci-mediatypes are required: Artifact Registry rejects
          # BuildKit's default cache manifest media type.
          cache-from: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache
          cache-to: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # A reused candidate already records its linux/amd64 digest. A fresh build reports the
      # digest of its image index, which Cloud Run never records (scripts/resolve-release-image.mjs
      # platformDigest), so resolve the image inside it.
      - name: Select immutable release image
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_DIGEST" ]; then
            digest="$EXISTING_DIGEST"
          else
            digest=$(docker buildx imagetools inspect --raw \
                       "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/wally/wally-api@${BUILT_DIGEST}" \
                     | node scripts/resolve-release-image.mjs platform)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------------
      # 2. Database migrations, run by the image this release deploys, so the schema and the
      #    code come from the same commit. Before the new revision exists, so it never meets
      #    an older schema. Migrations must stay backward compatible with the revision still
      #    serving: a failed release rolls back the API, never the schema (docs/DEPLOY.md).
      # ---------------------------------------------------------------------------------
      - name: Apply database migrations
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          DATABASE_URL=$(gcloud secrets versions access latest \
                           --secret=wally-database-url --project="${GCP_PROJECT_ID}")
          echo "::add-mask::${DATABASE_URL}"
          export DATABASE_URL
          docker run --rm -e DATABASE_URL \
            "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/wally/wally-api@${DIGEST}" \
            node dist/migrate-cli.js --require-purge-job

      # ---------------------------------------------------------------------------------
      # 3. Cloud Run, with NO traffic. The revision gets its own URL, production keeps
      #    serving the old one, and we smoke-test the new one before anything shifts — so a
      #    failed smoke test needs no rollback at all: users never saw it.
      # ---------------------------------------------------------------------------------
      - name: Deploy the API (no traffic yet)
        id: run_deploy
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          RUN_ENV: ${{ steps.existing.outputs.run_env }}
          RUN_SECRETS: ${{ steps.existing.outputs.run_secrets }}
          SERVICE_ACCOUNT: ${{ steps.existing.outputs.service_account }}
          SHORT: ${{ steps.ver.outputs.short }}
        run: |
          set -euo pipefail
          # RUN_ENV comes from apiConfig in scripts/resolve-release-image.mjs. The three
          # ASSISTANT_* values come from the repository variables of the same names and fall
          # back to the API's own defaults (apps/api/src/env.ts) when a variable is absent.
          if [ -z "$EXISTING_DIGEST" ]; then
          gcloud run deploy wally-api \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/wally/wally-api@${DIGEST}" \
            --region="${GCP_REGION}" \
            --service-account="${SERVICE_ACCOUNT}" \
            --set-env-vars="$RUN_ENV" \
            --set-secrets="$RUN_SECRETS" \
            --tag="rel-${SHORT}" \
            --revision-suffix="rel-${SHORT}" \
            --labels="wally-commit=${GITHUB_SHA}" \
            --no-traffic
          fi
          # jq, not a gcloud value() projection: that prints a list repr like ['https://…'],
          # and the quotes left inside made curl reject the URL.
          URL=$(gcloud run services describe wally-api --region="${GCP_REGION}" --format=json \
                | jq -r --arg tag "rel-${SHORT}" \
                    '[.status.traffic[] | select(.tag == $tag) | .url][0] // empty')
          [[ "$URL" == https://* ]] || { echo "::error::no URL for the candidate tag; got '${URL}'"; exit 1; }
          echo "candidate_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "candidate: ${URL}"

      - name: Assert the Cloud Run environment is correct
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The candidate must run the selected image with exactly apiConfig's variables and
          # service account, and DATABASE_URL from Secret Manager: nothing extra, nothing missing.
          node scripts/resolve-release-image.mjs verify

          # docs/DEPLOY.md section 9c: the invoker IAM check is disabled on this service
          # because the org policy forbids an allUsers binding. It is a service-level
          # annotation that survives revision deploys — but if it ever came back, every path
          # would 404 with a Google error page.
          test "$(gcloud run services describe wally-api --region="${GCP_REGION}" \
                    --format="value(metadata.annotations.'run.googleapis.com/invoker-iam-disabled')" \
                  | tr '[:upper:]' '[:lower:]')" = "true" \
            || { echo "::error::the invoker IAM check is enabled again; the service will 404 every request"; exit 1; }

      - name: Smoke-test the candidate revision
        run: |
          set -euo pipefail
          URL="${{ steps.run_deploy.outputs.candidate_url }}"
          [ -n "$URL" ] || { echo "::error::no candidate URL"; exit 1; }
          # /health runs one query (a candidate that cannot reach its database answers 503)
          # and reports the assistant's switch and model; check the fields, not the exact
          # body, and log the configuration the candidate booted with.
          health=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/health")
          jq -e '.status == "ok"
                 and .database == "ok"
                 and (.assistant.enabled | type == "boolean")
                 and (.assistant.model | type == "string" and test("^[a-z-]+:[^:]+$"))' \
            <<<"$health" > /dev/null \
            || { echo "::error::GET /health returned an unexpected body: $health"; exit 1; }
          echo "candidate assistant config: $(jq -c '.assistant' <<<"$health")"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/whiteboards")
          [ "$code" = "401" ] || { echo "::error::GET /whiteboards returned $code, expected 401"; exit 1; }
          echo "candidate healthy"

      # ---------------------------------------------------------------------------------
      # 4. Web bundle. Built HERE, not downloaded from the CI job: the CI build ran with
      #    VITE_API_BASE_URL pointing at localhost and must never be deployed.
      # ---------------------------------------------------------------------------------
      - name: Build the web bundle for production
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          for v in VITE_API_BASE_URL VITE_AUTH0_CLIENT_ID; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty — the bundle would ship broken"; exit 1; }
          done
          # --force with a cold cache dir. turbo.json declares env: ["VITE_*"] on build so
          # these are part of the hash, but this is the seatbelt: shipping a bundle that
          # points at localhost because of a stale cache entry is a silent, total outage.
          rm -rf .turbo/cache
          pnpm turbo run build --filter=@wally/web --force

      - name: Verify what was baked into the bundle
        run: |
          set -euo pipefail
          grep -rqF "${API_BASE_URL}" apps/web/dist/assets/*.js \
            || { echo "::error::the API base URL is not present in the built bundle"; exit 1; }
          if grep -rqF "localhost:4000" apps/web/dist/assets/*.js; then
            echo "::error::the bundle contains localhost:4000"; exit 1
          fi

      # ---------------------------------------------------------------------------------
      # 5. Workers, as versions that serve no traffic yet. Each version gets its own preview
      #    URL, smoke-tested before anything shifts. The proxy forwards to the service URL,
      #    which still serves the old revision here; the proxy does not depend on the revision.
      # ---------------------------------------------------------------------------------
      - name: Upload the Workers as versions (no traffic)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # The proxy forwards to the ORIGIN in its wrangler.jsonc. Refuse to ship one that no
          # longer names this service.
          origin=$(sed -nE 's/^ *"ORIGIN": *"([^"]+)".*/\1/p' apps/api-proxy/wrangler.jsonc)
          service=$(gcloud run services describe wally-api --region="${GCP_REGION}" --format='value(status.url)')
          [ -n "$origin" ] && [ "$origin" = "$service" ] \
            || { echo "::error::apps/api-proxy/wrangler.jsonc ORIGIN '${origin}' is not the service URL '${service}'"; exit 1; }
          upload() { # package, output prefix, Worker name
            local out="$RUNNER_TEMP/$2-upload.ndjson" line version preview
            rm -f "$out"
            WRANGLER_OUTPUT_FILE_PATH="$out" \
              pnpm --filter "$1" exec wrangler versions upload --message "${GITHUB_REF_NAME}"
            line=$(grep -h '"type":"version-upload"' "$out" | tail -n 1 || true)
            [ -n "$line" ] || line='{}'
            version=$(jq -r '.version_id // empty' <<<"$line")
            preview=$(jq -r '.preview_url // empty' <<<"$line")
            # Without a preview URL there is nothing safe to smoke-test: stop before traffic moves.
            [[ "$version" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] \
              || { echo "::error::the $1 upload reported no version ID"; exit 1; }
            # A version's preview URL starts with the version ID's first 8 characters. The
            # Worker's own workers.dev URL serves the deployed version, not this one.
            [[ "$preview" =~ ^https://${version:0:8}-${3}\.[a-z0-9-]+\.workers\.dev$ ]] \
              || { echo "::error::the $1 upload reported no preview URL"; exit 1; }
            echo "${2}_version=${version}" >> "$GITHUB_OUTPUT"
            echo "${2}_preview=${preview}" >> "$GITHUB_OUTPUT"
            echo "$1: version ${version}, preview ${preview}"
          }
          upload @wally/api-proxy proxy wally-api-proxy
          upload @wally/web web wally-web

      - name: Smoke-test the Worker previews
        env:
          PROXY: ${{ steps.upload.outputs.proxy_preview }}
          WEB: ${{ steps.upload.outputs.web_preview }}
        run: |
          set -euo pipefail
          retry=(--retry 5 --retry-all-errors --retry-delay 3)
          health=$(curl -fsS "${retry[@]}" "$PROXY/health")
          jq -e '.status == "ok" and .database == "ok"' <<<"$health" > /dev/null \
            || { echo "::error::the proxy preview's /health returned: $health"; exit 1; }
          CHECK_URL="$PROXY" node scripts/check-api-domain.mjs
          # No token: 401 with the OAuth challenge, which ChatGPT needs to find the sign-in.
          mcp=$(curl -sS -D - -o /dev/null -X POST -H 'Content-Type: application/json' \
                  --data '{}' "$PROXY/mcp")
          code=$(sed -nE '1s/^HTTP\/[0-9.]+ ([0-9]{3}).*/\1/p' <<<"$mcp")
          [ "$code" = 401 ] && grep -qiE '^www-authenticate:.*resource_metadata=' <<<"$mcp" \
            || { echo "::error::the proxy preview's /mcp answered $code without the OAuth challenge"; exit 1; }

          # -f makes curl treat a 404 as an error, so a preview that is still propagating is retried.
          [ "$(curl -fsS "${retry[@]}" -o /dev/null -w '%{http_code}' "$WEB/")" = "200" ]
          [ "$(curl -fsS "${retry[@]}" -o /dev/null -w '%{http_code}' "$WEB/boards/smoke-test")" = "200" ]
          index=$(curl -fsS "$WEB/")
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$index" | sed -n 1p || true)
          [ -n "$asset" ] || { echo "::error::could not find the entry bundle in the preview's index.html"; exit 1; }
          bundle=$(curl -fsS "$WEB$asset")
          grep -qF "${API_BASE_URL#https://}" <<<"$bundle" \
            || { echo "::error::the preview's bundle does not reference $API_BASE_URL"; exit 1; }
          headers=$(curl -fsSI "$WEB$asset")
          grep -qiE '^cache-control:.*immutable' <<<"$headers" \
            || { echo "::error::the preview does not serve /assets/* as immutable"; exit 1; }
          echo "Worker previews OK"

      # Prepare and validate ALL artifacts before enforcing the new API contract.
      # Existing tabs fail safely with 428 until refreshed during this short handover.
      - name: Shift all traffic to the new revision
        id: shift
        run: gcloud run services update-traffic wally-api --region="${GCP_REGION}" --to-revisions="wally-api-rel-${{ steps.ver.outputs.short }}=100"

      - name: Deploy the Workers
        id: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROXY_VERSION: ${{ steps.upload.outputs.proxy_version }}
          WEB_VERSION: ${{ steps.upload.outputs.web_version }}
        run: |
          set -euo pipefail
          pnpm --filter @wally/api-proxy exec wrangler versions deploy "${PROXY_VERSION}@100%" \
            --message "${GITHUB_REF_NAME}" -y
          pnpm --filter @wally/web exec wrangler versions deploy "${WEB_VERSION}@100%" \
            --message "${GITHUB_REF_NAME}" -y

      # ---------------------------------------------------------------------------------
      # 6. Post-deploy smoke. Read-only on purpose: the full E2E suite writes real notes and
      #    real invites, which is why it runs pre-merge against the emulator instead.
      # ---------------------------------------------------------------------------------
      - name: Smoke-test production
        run: |
          set -euo pipefail
          API="$API_BASE_URL"
          WEB="$WEB_ORIGIN"
          node scripts/check-api-domain.mjs

          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")" = "200" ]
          # Proves the SPA rewrite works for a deep link, not just the index.
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/boards/smoke-test")" = "200" ]

          # Prove the bundle actually SERVED at the web origin points at the right API.
          # Download first, then search: piping curl into an early-exiting reader (grep -q,
          # head) can kill curl with SIGPIPE, and pipefail then fails a check that matched.
          index=$(curl -fsS "$WEB/")
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$index" | sed -n 1p || true)
          [ -n "$asset" ] || { echo "::error::could not find the entry bundle in index.html"; exit 1; }
          bundle=$(curl -fsS "$WEB$asset")
          grep -qF "${API#https://}" <<<"$bundle" \
            || { echo "::error::the served bundle does not reference $API"; exit 1; }
          echo "production smoke OK"

      # ---------------------------------------------------------------------------------
      # Rollback. Only reached if something above failed after traffic moved. A failure
      # before that point needs no rollback: production never served the candidate.
      # ---------------------------------------------------------------------------------
      # If this step fails too, production may be mixed: follow "When a release fails" in
      # docs/DEPLOY.md before rerunning. The snapshot of a rerun refuses until it is fixed.
      - name: Restore captured release state after partial failure
        id: restore
        if: (failure() || cancelled()) && steps.shift.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release-state.mjs apply release-state.json ${{ steps.workers.outcome != 'skipped' && '--workers' || '' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Previous revision | \`${{ steps.prev.outputs.revision }}\` |"
            echo "| wally-api-proxy version | \`${{ steps.upload.outputs.proxy_version }}\` |"
            echo "| wally-web version | \`${{ steps.upload.outputs.web_version }}\` |"
            echo "| Recovery | ${{ steps.restore.outcome == 'skipped' && 'not needed' || steps.restore.outcome }} |"
            echo "| Web | ${WEB_ORIGIN} |"
            echo "| API | ${API_BASE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
