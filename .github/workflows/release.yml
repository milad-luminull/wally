name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # NEVER cancel a release in progress: a half-cancelled run can leave the API deployed and
  # Hosting stale. Releases queue instead.
  # Read-only preflight must not queue behind a release awaiting approval.
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-preflight-production' || 'release-production' }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: '15.30.2'
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ASSISTANT_ENABLED: ${{ vars.ASSISTANT_ENABLED || 'false' }}
  ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL || 'vertex:gemini-3.8-flash' }}
  ASSISTANT_VERTEX_LOCATION: ${{ vars.ASSISTANT_VERTEX_LOCATION || 'eu' }}
  AUTH0_ENABLED: ${{ vars.AUTH0_ENABLED || 'false' }}
  AUTH0_SIGNUP_ENABLED: ${{ vars.AUTH0_SIGNUP_ENABLED || 'false' }}
  MCP_ENABLED: ${{ vars.MCP_ENABLED || 'false' }}
  MCP_WRITES_ENABLED: ${{ vars.MCP_WRITES_ENABLED || 'false' }}
  MCP_CLIENT_ID: ${{ vars.MCP_CLIENT_ID }}
  VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER || 'firebase' }}
  VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}

jobs:
  # A v* tag can be pushed onto any commit, including one that never saw a pull request.
  # Require the CI run that `push: main` already started for EXACTLY this SHA to have passed,
  # rather than re-running the same suite a second time. The deploy job separately refuses
  # a tag that is not on main. A commit main never pointed at (the middle of a multi-commit
  # push) has no such run and is refused: only tested commits ship.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The push run can still be starting or in progress when the tag lands; wait for it.
          deadline=$((SECONDS + 25 * 60))
          grace=$((SECONDS + 2 * 60))
          while :; do
            run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&per_page=1" \
                    --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              if [ "$SECONDS" -ge "$grace" ]; then
                echo "::error title=Untested commit::no CI run on main for ${SHA}. Tag a commit that main pointed at after a push, or re-run CI on it."
                exit 1
              fi
              echo "no CI run for ${SHA} yet; waiting"
            else
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for ${SHA}: ${url}"
                  exit 0
                fi
                echo "::error title=CI did not pass::CI concluded '${conclusion}' for ${SHA}: ${url}"
                exit 1
              fi
              echo "CI for ${SHA} is ${status}: ${url}"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on ${SHA}"
              exit 1
            fi
            sleep 20
          done

  preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          install_components: beta
      - run: node scripts/check-api-domain.mjs
      - run: node scripts/check-release-prerequisites.mjs

  deploy:
    if: github.event_name == 'push'
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      # Required reviewers and a deployment tag policy of `v*` are configured on this
      # environment in repository settings. It is also the second half of the Workload
      # Identity Federation guard: the provider's attribute condition requires the
      # `environment` claim, which GitHub only mints for a job that declares one.
      name: production
      url: https://wally.luminull.com
    permissions:
      contents: read
      id-token: write # required for the OIDC token; granted on this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not an ancestor of main"; exit 1; }
          echo "${GITHUB_REF_NAME} is on main."

      - uses: ./.github/actions/setup

      - name: Derive version strings
        id: ver
        run: |
          set -euo pipefail
          SEMVER="${GITHUB_REF_NAME#v}"
          echo "semver=${SEMVER}"          >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}"    >> "$GITHUB_OUTPUT"

      # Keyless. The organization enforces iam.disableServiceAccountKeyCreation, so there is
      # no service-account JSON to store even if we wanted one.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          # The canonical-domain guard uses gcloud beta run domain-mappings.
          install_components: beta

      # status.url is Cloud Run's native hostname even when a custom domain is mapped.
      # Validate the mapping and canonical public endpoint before making any changes.
      - name: Test the API domain release guard
        run: node --test scripts/check-api-domain.test.mjs

      - name: Verify the canonical API domain and CORS
        run: node scripts/check-api-domain.mjs

      - name: Validate authentication and MCP rollout switches
        run: |
          set -euo pipefail
          for flag in AUTH0_ENABLED AUTH0_SIGNUP_ENABLED MCP_ENABLED MCP_WRITES_ENABLED ASSISTANT_ENABLED; do
            case "${!flag}" in
              true|false) ;;
              *) echo "::error::$flag must be true or false"; exit 1 ;;
            esac
          done
          case "$VITE_AUTH_PROVIDER" in
            firebase) ;;
            auth0)
              [ "$AUTH0_ENABLED" = true ] && [ -n "$VITE_AUTH0_CLIENT_ID" ] \
                || { echo "::error::Auth0 web login requires AUTH0_ENABLED=true and VITE_AUTH0_CLIENT_ID"; exit 1; }
              ;;
            *) echo "::error::VITE_AUTH_PROVIDER must be firebase or auth0"; exit 1 ;;
          esac
          if [ "$AUTH0_SIGNUP_ENABLED" = true ] && [ "$AUTH0_ENABLED" != true ]; then
            echo "::error::AUTH0_SIGNUP_ENABLED requires AUTH0_ENABLED=true"; exit 1
          fi
          if [ "$MCP_ENABLED" = true ]; then
            [ "$AUTH0_ENABLED" = true ] && [ -n "$MCP_CLIENT_ID" ] \
              || { echo "::error::MCP requires AUTH0_ENABLED=true and MCP_CLIENT_ID"; exit 1; }
          fi
          if [ "$MCP_WRITES_ENABLED" = true ] && [ "$MCP_ENABLED" != true ]; then
            echo "::error::MCP_WRITES_ENABLED requires MCP_ENABLED=true"; exit 1
          fi
          # IDs are public identifiers. Restrict their alphabet before adding them to
          # gcloud's @-delimited environment argument or a browser bundle.
          for client in MCP_CLIENT_ID VITE_AUTH0_CLIENT_ID; do
            case "${!client}" in
              *[!a-zA-Z0-9_-]*) echo "::error::$client contains invalid characters"; exit 1 ;;
            esac
          done

      - name: Resolve existing candidate image for retries
        id: existing
        run: node scripts/resolve-release-image.mjs

      - name: Verify prepared release prerequisites
        run: node scripts/check-release-prerequisites.mjs release-state.json

      - name: Preserve recovery state before mutations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-state.json
          if-no-files-found: error
          retention-days: 30

      # Record what to go back to. Captured BEFORE anything changes: at failure time the
      # release list has already shifted and index [1] would be the wrong one.
      - name: Capture the current production state
        id: prev
        run: |
          set -euo pipefail
          REV=$(jq -er '.revision' release-state.json)
          HV=$(jq -er '.hostingVersion' release-state.json)
          [ -n "$HV" ] || { echo "::error::missing Hosting rollback version"; exit 1; }
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "hosting_version=${HV}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run revision: ${REV}"
          echo "Hosting version:    ${HV:-<none>}"

      # ---------------------------------------------------------------------------------
      # 1. Firestore rules + indexes. First, because they are additive and backward
      #    compatible, and because both other tiers may depend on a new index existing.
      # ---------------------------------------------------------------------------------
      - name: Deploy Firestore rules and indexes
        run: |
          set -euo pipefail
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only firestore \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive

      # Index builds are asynchronous: the deploy returns long before the index is usable,
      # and querying one that is still building returns FAILED_PRECONDITION at runtime.
      - name: Wait for composite indexes to finish building
        run: |
          node scripts/wait-firestore-indexes.mjs

      # ---------------------------------------------------------------------------------
      # 2. API image. Built on the runner: GitHub runners are amd64, so the Apple-Silicon
      #    reason for Cloud Build (docs/DEPLOY.md section 8) does not apply in CI, and this
      #    avoids uploading the whole repo to a GCS staging bucket on every release.
      # ---------------------------------------------------------------------------------
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `gcloud auth configure-docker` installs a credential helper backed by the ADC that
      # the auth step wrote, which buildx then uses. Deliberately not docker/login-action
      # with steps.auth.outputs.auth_token: that output is the INTERMEDIATE federated STS
      # token from before service-account impersonation, not a registry credential.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the API image
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ steps.ver.outputs.semver }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:latest
          # image-manifest + oci-mediatypes are required: Artifact Registry rejects
          # BuildKit's default cache manifest media type.
          cache-from: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache
          cache-to: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Select immutable release image
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------------
      # 3. Cloud Run, with NO traffic. The revision gets its own URL, production keeps
      #    serving the old one, and we smoke-test the new one before anything shifts — so a
      #    failed smoke test needs no rollback at all: users never saw it.
      # ---------------------------------------------------------------------------------
      - name: Deploy the API (no traffic yet)
        id: run_deploy
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/wally/wally-api@${{ steps.image.outputs.digest }}"
          # ^@^ picks @ as the delimiter so a value containing a comma cannot silently split
          # into two variables. --set-env-vars REPLACES the whole set, which is deliberate:
          # the workflow, not deploy history, is the source of truth. All settings are listed,
          # and the next step asserts them back. The three ASSISTANT_* values come from the
          # repository variables of the same names and fall back to the API's own defaults
          # (apps/api/src/env.ts) when a variable is absent.
          RUN_ENV="^@^FIREBASE_PROJECT_ID=${GCP_PROJECT_ID}@NODE_ENV=production@CORS_ORIGIN=${WEB_ORIGIN}@FIRESTORE_DATABASE_ID=wally@ASSISTANT_ENABLED=${ASSISTANT_ENABLED}@ASSISTANT_MODEL=${ASSISTANT_MODEL}@ASSISTANT_VERTEX_LOCATION=${ASSISTANT_VERTEX_LOCATION}@AUTH0_ENABLED=${AUTH0_ENABLED}@AUTH0_SIGNUP_ENABLED=${AUTH0_SIGNUP_ENABLED}@AUTH0_ISSUER=https://login.luminull.com/@AUTH0_AUDIENCE=https://api.wally.luminull.com@MCP_ENABLED=${MCP_ENABLED}@MCP_WRITES_ENABLED=${MCP_WRITES_ENABLED}"
          if [ -n "$MCP_CLIENT_ID" ]; then RUN_ENV="${RUN_ENV}@MCP_CLIENT_ID=${MCP_CLIENT_ID}"; fi
          if [ -z '${{ steps.existing.outputs.digest }}' ]; then
          gcloud run deploy wally-api \
            --image="${IMAGE}" \
            --region="${GCP_REGION}" \
            --service-account="wally-api@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars="$RUN_ENV" \
            --tag="rel-${{ steps.ver.outputs.short }}" \
            --revision-suffix="rel-${{ steps.ver.outputs.short }}" \
            --labels="wally-commit=${GITHUB_SHA}" \
            --no-traffic
          fi
          # jq, not a gcloud value() projection: that prints a list repr like ['https://…'],
          # and the quotes left inside made curl reject the URL.
          URL=$(gcloud run services describe wally-api --region="${GCP_REGION}" --format=json \
                | jq -r --arg tag "rel-${{ steps.ver.outputs.short }}" \
                    '[.status.traffic[] | select(.tag == $tag) | .url][0] // empty')
          [[ "$URL" == https://* ]] || { echo "::error::no URL for the candidate tag; got '${URL}'"; exit 1; }
          echo "candidate_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "candidate: ${URL}"

      - name: Save candidate identity
        run: |
          jq --arg digest '${{ steps.image.outputs.digest }}' --arg revision 'wally-api-rel-${{ steps.ver.outputs.short }}' \
            --arg configHash '${{ steps.existing.outputs.config_hash }}' '. + {candidate: {digest: $digest, revision: $revision, configHash: $configHash}}' release-state.json > candidate-state.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert the Cloud Run environment is correct
        run: |
          set -euo pipefail
          gcloud run revisions describe "wally-api-rel-${{ steps.ver.outputs.short }}" --region="${GCP_REGION}" --format=json \
          | jq -e --arg auth0 "$AUTH0_ENABLED" --arg signup "$AUTH0_SIGNUP_ENABLED" --arg mcp "$MCP_ENABLED" \
              --arg writes "$MCP_WRITES_ENABLED" --arg client "$MCP_CLIENT_ID" '
              ([.spec.containers[0].env[]? | {key:.name, value:.value}] | from_entries) as $e
              | ($e.FIRESTORE_DATABASE_ID == "wally")
                and ($e.FIREBASE_PROJECT_ID != null)
                and ($e.NODE_ENV == "production")
                and ($e | has("FIRESTORE_EMULATOR_HOST") | not)
                and ($e | has("PORT") | not)
                and ($e.ASSISTANT_ENABLED == "true" or $e.ASSISTANT_ENABLED == "false")
                and ($e.ASSISTANT_MODEL | test("^[a-z-]+:[^:]+$"))
                and ($e.AUTH0_ENABLED == $auth0)
                and ($e.AUTH0_SIGNUP_ENABLED == $signup)
                and ($e.AUTH0_ISSUER == "https://login.luminull.com/")
                and ($e.AUTH0_AUDIENCE == "https://api.wally.luminull.com")
                and ($e.MCP_ENABLED == $mcp)
                and ($e.MCP_WRITES_ENABLED == $writes)
                and (($e.MCP_CLIENT_ID // "") == $client)
            ' > /dev/null \
          || { echo "::error title=Bad Cloud Run environment::Check named database, production mode, assistant settings, exact Auth0/MCP rollout settings, and absence of FIRESTORE_EMULATOR_HOST and PORT."; exit 1; }

          # docs/DEPLOY.md section 9c: the invoker IAM check is disabled on this service
          # because the org policy forbids an allUsers binding. It is a service-level
          # annotation that survives revision deploys — but if it ever came back, every path
          # would 404 with a Google error page.
          test "$(gcloud run services describe wally-api --region="${GCP_REGION}" \
                    --format="value(metadata.annotations.'run.googleapis.com/invoker-iam-disabled')" \
                  | tr '[:upper:]' '[:lower:]')" = "true" \
            || { echo "::error::the invoker IAM check is enabled again; the service will 404 every request"; exit 1; }

      - name: Smoke-test the candidate revision
        run: |
          set -euo pipefail
          URL="${{ steps.run_deploy.outputs.candidate_url }}"
          [ -n "$URL" ] || { echo "::error::no candidate URL"; exit 1; }
          # /health reports the assistant's switch and model next to the status; check the
          # fields, not the exact body, and log the configuration the candidate booted with.
          health=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/health")
          jq -e '.status == "ok"
                 and (.assistant.enabled | type == "boolean")
                 and (.assistant.model | type == "string" and test("^[a-z-]+:[^:]+$"))' \
            <<<"$health" > /dev/null \
            || { echo "::error::GET /health returned an unexpected body: $health"; exit 1; }
          echo "candidate assistant config: $(jq -c '.assistant' <<<"$health")"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/whiteboards")
          [ "$code" = "401" ] || { echo "::error::GET /whiteboards returned $code, expected 401"; exit 1; }
          echo "candidate healthy"

      # ---------------------------------------------------------------------------------
      # 4. Web bundle. Built HERE, not downloaded from the CI job: the CI build ran with
      #    VITE_API_BASE_URL pointing at localhost and must never reach Hosting.
      # ---------------------------------------------------------------------------------
      - name: Build the web bundle for production
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          for v in VITE_API_BASE_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty — the bundle would ship broken"; exit 1; }
          done
          # --force with a cold cache dir. turbo.json declares env: ["VITE_*"] on build so
          # these are part of the hash, but this is the seatbelt: shipping a bundle that
          # points at localhost because of a stale cache entry is a silent, total outage.
          rm -rf .turbo/cache
          pnpm turbo run build --filter=@wally/web --force

      - name: Verify what was baked into the bundle
        run: |
          set -euo pipefail
          grep -rqF "${API_BASE_URL}" apps/web/dist/assets/*.js \
            || { echo "::error::the API base URL is not present in the built bundle"; exit 1; }
          if grep -rqF "localhost:4000" apps/web/dist/assets/*.js; then
            echo "::error::the bundle contains localhost:4000"; exit 1
          fi

      # Prepare and validate BOTH artifacts before enforcing the new API contract.
      # Existing tabs fail safely with 428 until refreshed during this short handover.
      - name: Shift all traffic to the new revision
        id: shift
        run: gcloud run services update-traffic wally-api --region="${GCP_REGION}" --to-revisions="wally-api-rel-${{ steps.ver.outputs.short }}=100"

      - name: Deploy Firebase Hosting
        id: hosting
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only hosting \
            --project "${GCP_PROJECT_ID}" \
            --non-interactive

      # ---------------------------------------------------------------------------------
      # 5. Post-deploy smoke. Read-only on purpose: the full E2E suite writes real notes and
      #    real invites, which is why it runs pre-merge against the emulator instead.
      # ---------------------------------------------------------------------------------
      - name: Smoke-test production
        run: |
          set -euo pipefail
          API="$API_BASE_URL"
          WEB="$WEB_ORIGIN"
          node scripts/check-api-domain.mjs

          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")" = "200" ]
          # Proves the SPA rewrite works for a deep link, not just the index.
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/boards/smoke-test")" = "200" ]

          # Prove the bundle actually SERVED by Hosting points at the right API.
          # Download first, then search: piping curl into an early-exiting reader (grep -q,
          # head) can kill curl with SIGPIPE, and pipefail then fails a check that matched.
          index=$(curl -fsS "$WEB/")
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$index" | sed -n 1p)
          [ -n "$asset" ] || { echo "::error::could not find the entry bundle in index.html"; exit 1; }
          bundle=$(curl -fsS "$WEB$asset")
          grep -qF "${API#https://}" <<<"$bundle" \
            || { echo "::error::the served bundle does not reference $API"; exit 1; }
          echo "production smoke OK"

      # The account-cleanup worker (a Cloud Run job its schedule starts every 5 minutes) runs
      # the API image, so it moves to this release's tested image. Only the image changes; the
      # job's identity, secret and settings are owned by scripts/deploy-account-cleanup.sh.
      # Last, and outside the rollback below: the site is already live, and if this fails
      # the worker keeps its previous image. Deletions are leased and resumable, so an
      # execution already running on the old image is safe.
      - name: Move the account-cleanup worker to this release
        id: worker
        if: env.AUTH0_ENABLED == 'true'
        run: |
          gcloud run jobs update wally-account-cleanup --region="${GCP_REGION}" \
            --image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/wally/wally-api@${{ steps.image.outputs.digest }}"

      # ---------------------------------------------------------------------------------
      # Rollback. Only reached if something above failed after traffic moved. A failure
      # before that point needs no rollback: production never served the candidate.
      # ---------------------------------------------------------------------------------
      - name: Restore captured release state after partial failure
        if: (failure() || cancelled()) && steps.worker.outcome != 'failure' && steps.worker.outcome != 'cancelled' && steps.shift.outcome != 'skipped' && steps.shift.outcome != ''
        run: node scripts/recover-release.mjs --apply release-state.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image digest | \`${{ steps.image.outputs.digest }}\` |"
            echo "| Previous revision | \`${{ steps.prev.outputs.revision }}\` |"
            echo "| Web | ${WEB_ORIGIN} |"
            echo "| API | ${API_BASE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
