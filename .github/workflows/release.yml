name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # NEVER cancel a release in progress: a half-cancelled run can leave the API deployed and
  # Hosting stale. Releases queue instead.
  group: release-production
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: '15.30.2'

jobs:
  # A v* tag can be pushed onto any commit, including one that never saw a pull request.
  # Require the CI run that `push: main` already started for EXACTLY this SHA to have passed,
  # rather than re-running the same suite a second time. The deploy job separately refuses
  # a tag that is not on main. A commit main never pointed at (the middle of a multi-commit
  # push) has no such run and is refused: only tested commits ship.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The push run can still be starting or in progress when the tag lands; wait for it.
          deadline=$((SECONDS + 25 * 60))
          grace=$((SECONDS + 2 * 60))
          while :; do
            run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&per_page=1" \
                    --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              if [ "$SECONDS" -ge "$grace" ]; then
                echo "::error title=Untested commit::no CI run on main for ${SHA}. Tag a commit that main pointed at after a push, or re-run CI on it."
                exit 1
              fi
              echo "no CI run for ${SHA} yet; waiting"
            else
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for ${SHA}: ${url}"
                  exit 0
                fi
                echo "::error title=CI did not pass::CI concluded '${conclusion}' for ${SHA}: ${url}"
                exit 1
              fi
              echo "CI for ${SHA} is ${status}: ${url}"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on ${SHA}"
              exit 1
            fi
            sleep 20
          done

  deploy:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      # Required reviewers and a deployment tag policy of `v*` are configured on this
      # environment in repository settings. It is also the second half of the Workload
      # Identity Federation guard: the provider's attribute condition requires the
      # `environment` claim, which GitHub only mints for a job that declares one.
      name: production
      url: https://luminull-wally.web.app
    permissions:
      contents: read
      id-token: write # required for the OIDC token; granted on this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} points at a commit that is not an ancestor of main"; exit 1; }
          echo "${GITHUB_REF_NAME} is on main."

      - uses: ./.github/actions/setup

      - name: Derive version strings
        id: ver
        run: |
          set -euo pipefail
          SEMVER="${GITHUB_REF_NAME#v}"
          echo "semver=${SEMVER}"          >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}"    >> "$GITHUB_OUTPUT"

      # Keyless. The organization enforces iam.disableServiceAccountKeyCreation, so there is
      # no service-account JSON to store even if we wanted one.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Vite inlines VITE_API_BASE_URL at build time and Cloud Run's CORS_ORIGIN must match
      # the Hosting origin exactly, so both are declared as repository variables. Assert the
      # declared API URL still matches the live service rather than trusting either blindly:
      # Cloud Run also answers on a project-number hostname, and a bundle built against the
      # wrong one fails every CORS preflight.
      - name: Assert the declared API URL matches the live service
        run: |
          set -euo pipefail
          case "${{ vars.API_BASE_URL }}" in
            */) echo "::error::API_BASE_URL must not end in a slash"; exit 1 ;;
          esac
          LIVE=$(gcloud run services describe wally-api \
                   --region="${{ vars.GCP_REGION }}" --format='value(status.url)')
          if [ "$LIVE" != "${{ vars.API_BASE_URL }}" ]; then
            echo "::error title=API URL drift::repository variable API_BASE_URL is '${{ vars.API_BASE_URL }}' but the live service is '$LIVE'."
            exit 1
          fi

      # Record what to go back to. Captured BEFORE anything changes: at failure time the
      # release list has already shifted and index [1] would be the wrong one.
      - name: Capture the current production state
        id: prev
        run: |
          set -euo pipefail
          # The revision serving 100%, not traffic[0]: tagged 0% revisions are listed too, and
          # rolling back to one of those once sent production to an older release.
          REV=$(gcloud run services describe wally-api --region="${{ vars.GCP_REGION }}" --format=json \
                | jq -r '.status as $s
                         | [$s.traffic[] | select((.percent // 0) == 100)][0]
                         | if . == null then empty
                           elif .revisionName then .revisionName
                           else $s.latestReadyRevisionName end')
          [ -n "$REV" ] || { echo "::error::no single revision serves 100% of traffic; refusing to release without a rollback target"; exit 1; }
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          HV=$(curl -fsS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                 "https://firebasehosting.googleapis.com/v1beta1/sites/${{ vars.GCP_PROJECT_ID }}/releases?pageSize=1" \
               | jq -r '.releases[0].version.name // empty')
          echo "hosting_version=${HV}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run revision: ${REV}"
          echo "Hosting version:    ${HV:-<none>}"

      # ---------------------------------------------------------------------------------
      # 1. Firestore rules + indexes. First, because they are additive and backward
      #    compatible, and because both other tiers may depend on a new index existing.
      # ---------------------------------------------------------------------------------
      - name: Deploy Firestore rules and indexes
        run: |
          set -euo pipefail
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only firestore \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      # Index builds are asynchronous: the deploy returns long before the index is usable,
      # and querying one that is still building returns FAILED_PRECONDITION at runtime.
      - name: Wait for composite indexes to finish building
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            PENDING=$(gcloud firestore indexes composite list --database=wally \
                        --format='value(state)' 2>/dev/null | grep -cv '^READY$' || true)
            [ "${PENDING:-0}" -eq 0 ] && { echo "all indexes READY"; exit 0; }
            echo "waiting for ${PENDING} index(es)…"
            sleep 20
          done
          echo "::error::composite indexes were still building after 20 minutes"; exit 1

      # ---------------------------------------------------------------------------------
      # 2. API image. Built on the runner: GitHub runners are amd64, so the Apple-Silicon
      #    reason for Cloud Build (docs/DEPLOY.md section 8) does not apply in CI, and this
      #    avoids uploading the whole repo to a GCS staging bucket on every release.
      # ---------------------------------------------------------------------------------
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `gcloud auth configure-docker` installs a credential helper backed by the ADC that
      # the auth step wrote, which buildx then uses. Deliberately not docker/login-action
      # with steps.auth.outputs.auth_token: that output is the INTERMEDIATE federated STS
      # token from before service-account impersonation, not a registry credential.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push the API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:${{ steps.ver.outputs.semver }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:latest
          # image-manifest + oci-mediatypes are required: Artifact Registry rejects
          # BuildKit's default cache manifest media type.
          cache-from: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache
          cache-to: type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # ---------------------------------------------------------------------------------
      # 3. Cloud Run, with NO traffic. The revision gets its own URL, production keeps
      #    serving the old one, and we smoke-test the new one before anything shifts — so a
      #    failed smoke test needs no rollback at all: users never saw it.
      # ---------------------------------------------------------------------------------
      - name: Deploy the API (no traffic yet)
        id: run_deploy
        run: |
          set -euo pipefail
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wally/wally-api@${{ steps.build.outputs.digest }}"
          # ^@^ picks @ as the delimiter so a value containing a comma cannot silently split
          # into two variables. --set-env-vars REPLACES the whole set, which is deliberate:
          # the workflow, not deploy history, is the source of truth. All seven are listed,
          # and the next step asserts them back. The three ASSISTANT_* values come from the
          # repository variables of the same names and fall back to the API's own defaults
          # (apps/api/src/env.ts) when a variable is absent.
          gcloud run deploy wally-api \
            --image="${IMAGE}" \
            --region="${{ vars.GCP_REGION }}" \
            --service-account="wally-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars="^@^FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@NODE_ENV=production@CORS_ORIGIN=${{ vars.WEB_ORIGIN }}@FIRESTORE_DATABASE_ID=wally@ASSISTANT_ENABLED=${{ vars.ASSISTANT_ENABLED || 'false' }}@ASSISTANT_MODEL=${{ vars.ASSISTANT_MODEL || 'vertex:gemini-3.8-flash' }}@ASSISTANT_VERTEX_LOCATION=${{ vars.ASSISTANT_VERTEX_LOCATION || 'eu' }}" \
            --tag="rel-${{ steps.ver.outputs.short }}" \
            --revision-suffix="rel-${{ steps.ver.outputs.short }}" \
            --no-traffic
          # jq, not a gcloud value() projection: that prints a list repr like ['https://…'],
          # and the quotes left inside made curl reject the URL.
          URL=$(gcloud run services describe wally-api --region="${{ vars.GCP_REGION }}" --format=json \
                | jq -r --arg tag "rel-${{ steps.ver.outputs.short }}" \
                    '[.status.traffic[] | select(.tag == $tag) | .url][0] // empty')
          [[ "$URL" == https://* ]] || { echo "::error::no URL for the candidate tag; got '${URL}'"; exit 1; }
          echo "candidate_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "candidate: ${URL}"

      - name: Assert the Cloud Run environment is correct
        run: |
          set -euo pipefail
          gcloud run services describe wally-api --region="${{ vars.GCP_REGION }}" --format=json \
          | jq -e '
              ([.spec.template.spec.containers[0].env[]? | {key:.name, value:.value}] | from_entries) as $e
              | ($e.FIRESTORE_DATABASE_ID == "wally")
                and ($e.FIREBASE_PROJECT_ID != null)
                and ($e.NODE_ENV == "production")
                and ($e | has("FIRESTORE_EMULATOR_HOST") | not)
                and ($e | has("PORT") | not)
                and ($e.ASSISTANT_ENABLED == "true" or $e.ASSISTANT_ENABLED == "false")
                and ($e.ASSISTANT_MODEL | test("^[a-z-]+:[^:]+$"))
            ' > /dev/null \
          || { echo "::error title=Bad Cloud Run environment::FIRESTORE_DATABASE_ID must be 'wally' (otherwise every write goes to the US (default) database), NODE_ENV must be production, ASSISTANT_ENABLED must be 'true' or 'false', ASSISTANT_MODEL must be provider:model, and neither FIRESTORE_EMULATOR_HOST nor PORT may be set."; exit 1; }

          # docs/DEPLOY.md section 9c: the invoker IAM check is disabled on this service
          # because the org policy forbids an allUsers binding. It is a service-level
          # annotation that survives revision deploys — but if it ever came back, every path
          # would 404 with a Google error page.
          test "$(gcloud run services describe wally-api --region="${{ vars.GCP_REGION }}" \
                    --format="value(metadata.annotations.'run.googleapis.com/invoker-iam-disabled')" \
                  | tr '[:upper:]' '[:lower:]')" = "true" \
            || { echo "::error::the invoker IAM check is enabled again; the service will 404 every request"; exit 1; }

      - name: Smoke-test the candidate revision
        run: |
          set -euo pipefail
          URL="${{ steps.run_deploy.outputs.candidate_url }}"
          [ -n "$URL" ] || { echo "::error::no candidate URL"; exit 1; }
          # /health reports the assistant's switch and model next to the status; check the
          # fields, not the exact body, and log the configuration the candidate booted with.
          health=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/health")
          jq -e '.status == "ok"
                 and (.assistant.enabled | type == "boolean")
                 and (.assistant.model | type == "string" and test("^[a-z-]+:[^:]+$"))' \
            <<<"$health" > /dev/null \
            || { echo "::error::GET /health returned an unexpected body: $health"; exit 1; }
          echo "candidate assistant config: $(jq -c '.assistant' <<<"$health")"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/whiteboards")
          [ "$code" = "401" ] || { echo "::error::GET /whiteboards returned $code, expected 401"; exit 1; }
          echo "candidate healthy"

      # ---------------------------------------------------------------------------------
      # 4. Web bundle. Built HERE, not downloaded from the CI job: the CI build ran with
      #    VITE_API_BASE_URL pointing at localhost and must never reach Hosting.
      # ---------------------------------------------------------------------------------
      - name: Build the web bundle for production
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          for v in VITE_API_BASE_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty — the bundle would ship broken"; exit 1; }
          done
          # --force with a cold cache dir. turbo.json declares env: ["VITE_*"] on build so
          # these are part of the hash, but this is the seatbelt: shipping a bundle that
          # points at localhost because of a stale cache entry is a silent, total outage.
          rm -rf .turbo/cache
          pnpm turbo run build --filter=@wally/web --force

      - name: Verify what was baked into the bundle
        run: |
          set -euo pipefail
          grep -rqF "${{ vars.API_BASE_URL }}" apps/web/dist/assets/*.js \
            || { echo "::error::the API base URL is not present in the built bundle"; exit 1; }
          if grep -rqF "localhost:4000" apps/web/dist/assets/*.js; then
            echo "::error::the bundle contains localhost:4000"; exit 1
          fi

      # Prepare and validate BOTH artifacts before enforcing the new API contract.
      # Existing tabs fail safely with 428 until refreshed during this short handover.
      - name: Shift all traffic to the new revision
        id: shift
        run: gcloud run services update-traffic wally-api --region="${{ vars.GCP_REGION }}" --to-latest

      - name: Deploy Firebase Hosting
        id: hosting
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      # ---------------------------------------------------------------------------------
      # 5. Post-deploy smoke. Read-only on purpose: the full E2E suite writes real notes and
      #    real invites, which is why it runs pre-merge against the emulator instead.
      # ---------------------------------------------------------------------------------
      - name: Smoke-test production
        run: |
          set -euo pipefail
          API="${{ vars.API_BASE_URL }}"
          WEB="${{ vars.WEB_ORIGIN }}"

          health=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$API/health")
          jq -e '.status == "ok"' <<<"$health" > /dev/null \
            || { echo "::error::GET /health returned an unexpected body: $health"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/whiteboards")
          [ "$code" = "401" ] || { echo "::error::GET /whiteboards returned $code, expected 401"; exit 1; }

          acao=$(curl -sI -X OPTIONS "$API/whiteboards" \
                   -H "Origin: $WEB" -H "Access-Control-Request-Method: GET" \
                 | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
          [ "$acao" = "$WEB" ] || { echo "::error::CORS mismatch: got '$acao', want '$WEB'"; exit 1; }

          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")" = "200" ]
          # Proves the SPA rewrite works for a deep link, not just the index.
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/boards/smoke-test")" = "200" ]

          # Prove the bundle actually SERVED by Hosting points at the right API.
          # Download first, then search: piping curl into an early-exiting reader (grep -q,
          # head) can kill curl with SIGPIPE, and pipefail then fails a check that matched.
          index=$(curl -fsS "$WEB/")
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$index" | sed -n 1p)
          [ -n "$asset" ] || { echo "::error::could not find the entry bundle in index.html"; exit 1; }
          bundle=$(curl -fsS "$WEB$asset")
          grep -qF "${API#https://}" <<<"$bundle" \
            || { echo "::error::the served bundle does not reference $API"; exit 1; }
          echo "production smoke OK"

      # ---------------------------------------------------------------------------------
      # Rollback. Only reached if something above failed after traffic moved. A failure
      # before that point needs no rollback: production never served the candidate.
      # ---------------------------------------------------------------------------------
      - name: Roll back Cloud Run
        if: failure() && steps.shift.outcome == 'success' && steps.prev.outputs.revision != ''
        run: |
          echo "::warning::rolling Cloud Run back to ${{ steps.prev.outputs.revision }}"
          gcloud run services update-traffic wally-api --region="${{ vars.GCP_REGION }}" \
            --to-revisions="${{ steps.prev.outputs.revision }}=100"

      # There is no `firebase hosting:rollback` command. A release is created by POSTing the
      # previous version name, which is why steps.prev captured it before the deploy.
      - name: Roll back Firebase Hosting
        if: failure() && steps.hosting.outcome != 'skipped' && steps.prev.outputs.hosting_version != ''
        run: |
          echo "::warning::restoring Hosting version ${{ steps.prev.outputs.hosting_version }}"
          curl -fsS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Length: 0" \
            "https://firebasehosting.googleapis.com/v1beta1/sites/${{ vars.GCP_PROJECT_ID }}/releases?versionName=${{ steps.prev.outputs.hosting_version }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Image digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Previous revision | \`${{ steps.prev.outputs.revision }}\` |"
            echo "| Web | ${{ vars.WEB_ORIGIN }} |"
            echo "| API | ${{ vars.API_BASE_URL }} |"
          } >> "$GITHUB_STEP_SUMMARY"
