version: 2
updates:
  # Dependabot does not discover composite actions from "/" — it needs the directory.
  # Listing both in one entry lets a single group cover them, so it's one PR, not two.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup']
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  # The npm ecosystem understands pnpm workspaces via the root lockfile.
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Playwright browser binaries are cached by version and a major bump can change
      # device descriptors; land those deliberately rather than on a Monday morning.
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-major']
      # plugin-react majors track vite majors (6.x needs vite 8); move them with vite.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/web', '/infra']
    schedule: { interval: weekly }
    groups:
      images: { patterns: ['*'] }
    ignore:
      # Odd-numbered Node majors never become LTS; move to the next LTS deliberately.
      - dependency-name: node
        update-types: ['version-update:semver-major']
