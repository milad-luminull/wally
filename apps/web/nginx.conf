server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router owns client-side routes like /boards/:id, /login, so
    # any path nginx doesn't have a file for falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default build output) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
