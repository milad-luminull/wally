<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The wall colour, so the browser chrome meets the board. ThemeProvider keeps it in
         step with the active theme. -->
    <meta name="theme-color" content="#F6F6F7" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Brand only, so the tab is never in the wrong language while the bundle loads.
         LanguageProvider sets the full localized title from the catalogue. -->
    <title>Wally</title>
    <!-- Geist is self-hosted (public/fonts, @font-face in globals.css), so there is no
         third-party font request to preconnect to. Preloaded so the first paint doesn't
         flash the fallback. -->
    <link
      rel="preload"
      href="/fonts/geist-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Applies the theme before first paint so dark mode never flashes white. Mirrors
         readStoredTheme in src/lib/theme.tsx; the key is THEME_STORAGE_KEY. -->
    <script>
      (function () {
        var theme = 'system';
        var palette = 'paper';
        try {
          palette = localStorage.getItem('wally.palette') || 'paper';
          theme = localStorage.getItem('wally.theme') || 'system';
        } catch (e) {}
        var palettes = [
          'minimal',
          'paper',
          'morning',
          'highlighter',
          'aurora',
          'daybreak',
          'sprout',
          'amber',
          'neutral',
        ];
        document.documentElement.dataset.palette = palettes.includes(palette) ? palette : 'paper';
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0A0B');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
