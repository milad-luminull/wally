      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #242424;
        --muted: #555;
        --border: #d7d7d7;
        --link: #2059a0;
        --surface: #f0f1f3;
        --chosen: #242424;
        --onchosen: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191919;
          --fg: #e8e8e8;
          --muted: #b3b3b3;
          --border: #434343;
          --link: #9bc3f0;
          --surface: #252629;
          --chosen: #e8e8e8;
          --onchosen: #191919;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 system-ui,
          -apple-system,
          sans-serif;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: -0.4px;
      }
      h2 {
        font-size: 19px;
        line-height: 1.3;
      }
      h3 {
        font-size: 16px;
        line-height: 1.35;
      }
      a {
        color: var(--link);
        text-underline-offset: 3px;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        padding: 7px 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      button.selected {
        background: var(--chosen);
        color: var(--onchosen);
        border-color: var(--chosen);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
        line-height: 1.5;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 13px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: var(--surface);
        font-size: 13px;
        font-weight: 600;
      }
      td:first-child {
        font-weight: 500;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .callout {
        background: var(--surface);
        padding: 22px;
        border-radius: 6px;
        display: grid;
        gap: 10px;
      }
      .callout h2 {
        color: var(--link);
      }
      input {
        font: inherit;
      }
      label {
        font-size: 13px;
      }
      @media (max-width: 600px) {
        #root > div {
          padding: 16px !important;
        }
        th,
        td {
          min-width: 160px;
          padding: 10px;
        }
        h1 {
          font-size: 23px;
        }
      }
      @media print {
        button {
          display: none;
        }
      }
    </style>
